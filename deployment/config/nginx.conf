# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.mutation.cc;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS / WSS server
server {
    listen 443 ssl;
    server_name api.mutation.cc;

    # SSL certificate
    ssl_certificate     /etc/letsencrypt/live/api.mutation.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mutation.cc/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Proxy all requests to Daphne
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check endpoint
    location /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        allow all;
    }

    # static files if collected by Django
    location /staticfiles/ {
        alias /var/www/staticfiles/;
    }

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
}
