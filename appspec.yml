version: 0.0
os: linux
files:
  - source: /
    destination: /home/ec2-user/app

permissions:
  - object: /home/ec2-user/app
    owner: ec2-user
    group: ec2-user
    mode: 755
  - object: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: 644

hooks:
  BeforeInstall:
    - location: deployment/scripts/install.sh
      timeout: 300
      runas: root

  AfterInstall:
    - location: deployment/scripts/prep.sh
      timeout: 120
      runas: ec2-user

  ApplicationStart:
    - location: deployment/scripts/geoip.sh
      timeout: 300
      runas: ec2-user

    - location: deployment/scripts/start.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: deployment/scripts/healthz.sh
      timeout: 60
      runas: ec2-user
