services:
  db:
    image: ankane/pgvector:latest
    container_name: afp-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: diff123Q
      POSTGRES_DB: <app-name>

    ports:
      - "5432:5432"
    volumes:
      - ./.db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "password"]
    volumes:
      - ./.redis-data:/data

volumes:
  .db:
  .redis-data:
